name: Validate Windows runtime
run-name: Windows ${{ inputs.kind || 'player' }} ${{ inputs.asset_name || 'runner' }}
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Runtime acceptance target
        type: choice
        default: player
        options: [player, native, desktop]
        required: false
      release_tag:
        description: Draft release containing candidates (empty checks runner availability)
        required: false
        type: string
      asset_name:
        description: Candidate player ZIP asset name
        required: false
        type: string
      sha256:
        description: Expected player SHA-256
        required: false
        type: string
      harness_asset:
        description: Compiled validation harness ZIP asset name
        required: false
        type: string
      harness_sha256:
        description: Expected harness SHA-256
        required: false
        type: string
      installer_asset:
        description: Checksummed desktop NSIS installer (desktop only)
        required: false
        type: string
      installer_sha256:
        description: Expected desktop installer SHA-256
        required: false
        type: string
permissions:
  # GitHub exposes draft assets only to tokens with repository push permission.
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Environment]::OSVersion.VersionString
          node --version
          if (-not [Environment]::Is64BitOperatingSystem) { throw 'WINDOWS_X64_REQUIRED' }
          Write-Output 'WINDOWS_RUNNER_READY'
      - name: Verify packaged player with Main lifecycle
        if: inputs.release_tag != '' && inputs.kind != 'native' && inputs.kind != 'desktop'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          HARNESS_ASSET: ${{ inputs.harness_asset }}
          HARNESS_SHA256: ${{ inputs.harness_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^[A-Za-z0-9._-]+$') { throw 'INVALID_RELEASE_TAG' }
          if ($env:ASSET_NAME -notmatch '^MIPO-Player-[A-Za-z0-9._-]+-windows-x64.zip$') { throw 'INVALID_ASSET_NAME' }
          if ($env:HARNESS_ASSET -notmatch '^MIPO-Player-Smoke-[a-f0-9]{12}.zip$') { throw 'INVALID_HARNESS_NAME' }
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-f]{64}$' -or $env:HARNESS_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'INVALID_CHECKSUM' }
          $candidate = Join-Path $env:RUNNER_TEMP 'mipo-candidate'
          New-Item -ItemType Directory -Path $candidate | Out-Null
          foreach ($entry in @(@{name=$env:ASSET_NAME;hash=$env:EXPECTED_SHA256},@{name=$env:HARNESS_ASSET;hash=$env:HARNESS_SHA256})) {
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $entry.name --dir $candidate
            if ($LASTEXITCODE -ne 0) { throw 'CANDIDATE_DOWNLOAD_FAILED' }
            $archive = Join-Path $candidate $entry.name
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $entry.hash) { throw 'CANDIDATE_CHECKSUM_MISMATCH' }
            Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $candidate 'runtime')
          }
          # Download credentials are unnecessary in the tested processes.
          $env:GH_TOKEN = $null
          $env:GITHUB_TOKEN = $null
          $expanded = Join-Path $candidate 'runtime'
          $executables = @(Get-ChildItem -LiteralPath $expanded -Recurse -Filter 'mipo-player.exe')
          $harnesses = @(Get-ChildItem -LiteralPath $expanded -Recurse -Filter 'managed-player-smoke.mjs')
          if ($executables.Count -ne 1 -or $harnesses.Count -ne 1) { throw 'RUNTIME_ENTRY_COUNT' }
          $env:MIPO_PLAYER_EXECUTABLE = $executables[0].FullName
          $env:MIPO_PLAYER_SMOKE_REPORT = Join-Path $candidate 'managed-report.json'
          # This compiled harness uses the application's actual Main launcher.
          # No private source checkout or account/EVS credentials are needed here.
          & node $harnesses[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'MAIN_PLAYER_SMOKE_FAILED' }
          $reports = Get-Content -LiteralPath $env:MIPO_PLAYER_SMOKE_REPORT -Raw | ConvertFrom-Json
          if ($reports.Count -ne 4 -or $reports[3].private -ne $true) { throw 'PLAYER_FIXTURE_COUNT' }
          foreach ($report in $reports) {
            if ($report.supported -ne $true -or $report.isolated -ne $true) { throw 'PLAYER_EME_FAILED' }
            if ($report.electron -ne '45.2.1' -or $report.chromium -ne '156.0.8078.75') { throw 'PLAYER_RUNTIME_VERSION_MISMATCH' }
          }
          # An internal private launch must fail before making a temp profile
          # when its Main lifecycle owner is absent.
          $temporaryRoot = [IO.Path]::GetTempPath()
          $before = @(Get-ChildItem -LiteralPath $temporaryRoot -Directory -Filter 'mipo-player-private-*' | ForEach-Object FullName)
          $env:MIPO_PLAYER_MANAGED = $null
          $env:MIPO_PLAYER_REPORT = Join-Path $candidate 'unmanaged-report.json'
          $unmanaged = Start-Process -FilePath $env:MIPO_PLAYER_EXECUTABLE -ArgumentList @('--smoke','--private-session=unmanaged_fixture') -PassThru
          try {
            if (-not $unmanaged.WaitForExit(10000)) { throw 'UNMANAGED_PRIVATE_DID_NOT_EXIT' }
            $denied = Get-Content -LiteralPath $env:MIPO_PLAYER_REPORT -Raw | ConvertFrom-Json
            if ($unmanaged.ExitCode -eq 0 -or $denied.error -ne 'PLAYER_PRIVATE_REQUIRES_MAIN') { throw 'UNMANAGED_PRIVATE_NOT_DENIED' }
            $added = @(Get-ChildItem -LiteralPath $temporaryRoot -Directory -Filter 'mipo-player-private-*' | ForEach-Object FullName | Where-Object { $before -notcontains $_ })
            if ($added.Count -ne 0) { throw 'UNMANAGED_PRIVATE_CREATED_DATA' }
          } finally {
            if (-not $unmanaged.HasExited) { Stop-Process -Id $unmanaged.Id -Force }
          }
          Write-Output 'WINDOWS_MAIN_PLAYER_SMOKE_PASSED'
      - name: Verify desktop ZIP and installed application
        if: inputs.release_tag != '' && inputs.kind == 'desktop'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          HARNESS_ASSET: ${{ inputs.harness_asset }}
          HARNESS_SHA256: ${{ inputs.harness_sha256 }}
          INSTALLER_ASSET: ${{ inputs.installer_asset }}
          INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^[A-Za-z0-9._-]+$') { throw 'INVALID_RELEASE_TAG' }
          if ($env:ASSET_NAME -notmatch '^MIPO-Desktop-[A-Za-z0-9._-]+-windows-x64.zip$') { throw 'INVALID_ASSET_NAME' }
          if ($env:HARNESS_ASSET -notmatch '^MIPO-Desktop-Smoke-[a-f0-9]{12}.zip$') { throw 'INVALID_HARNESS_NAME' }
          if ($env:INSTALLER_ASSET -notmatch '^MIPO-Desktop-[A-Za-z0-9._-]+-windows-x64-Setup.exe$') { throw 'INVALID_INSTALLER_NAME' }
          foreach ($hash in @($env:EXPECTED_SHA256, $env:HARNESS_SHA256, $env:INSTALLER_SHA256)) {
            if ($hash -notmatch '^[0-9a-f]{64}$') { throw 'INVALID_CHECKSUM' }
          }
          function Assert-X64Executable([string] $file) {
            $stream = [IO.File]::OpenRead($file)
            $reader = [IO.BinaryReader]::new($stream)
            try {
              if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'PE_DOS_HEADER_MISSING' }
              $stream.Position = 0x3c
              $header = $reader.ReadUInt32()
              if ($header -lt 0x40 -or $header -gt $stream.Length - 6) { throw 'INVALID_PE_OFFSET' }
              $stream.Position = $header
              if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0x8664) { throw 'WINDOWS_X64_EXECUTABLE_REQUIRED' }
            } finally {
              $reader.Dispose()
              $stream.Dispose()
            }
          }
          $candidate = Join-Path $env:RUNNER_TEMP 'mipo-desktop'
          $expanded = Join-Path $candidate 'runtime'
          New-Item -ItemType Directory -Path $expanded | Out-Null
          foreach ($entry in @(@{name=$env:ASSET_NAME;hash=$env:EXPECTED_SHA256},@{name=$env:HARNESS_ASSET;hash=$env:HARNESS_SHA256},@{name=$env:INSTALLER_ASSET;hash=$env:INSTALLER_SHA256})) {
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $entry.name --dir $candidate
            if ($LASTEXITCODE -ne 0) { throw 'CANDIDATE_DOWNLOAD_FAILED' }
            $archive = Join-Path $candidate $entry.name
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $entry.hash) { throw 'CANDIDATE_CHECKSUM_MISMATCH' }
            if ($entry.name.EndsWith('.zip')) { Expand-Archive -LiteralPath $archive -DestinationPath $expanded }
          }
          $env:GH_TOKEN = $null
          $env:GITHUB_TOKEN = $null
          $executables = @(Get-ChildItem -LiteralPath $expanded -Recurse -Filter 'mipo.exe')
          $harnesses = @(Get-ChildItem -LiteralPath $expanded -Recurse -Filter 'packaged-smoke.mjs')
          if ($executables.Count -ne 1 -or $harnesses.Count -ne 1) { throw 'DESKTOP_ENTRY_COUNT' }
          $portableRoot = $executables[0].Directory.FullName
          Assert-X64Executable $executables[0].FullName
          Assert-X64Executable (Join-Path $portableRoot 'resources/mipo-core.exe')
          $env:MIPO_SMOKE_SLOW = '1'
          $env:MIPO_SMOKE_EXECUTABLE = $executables[0].FullName
          $log = Join-Path $candidate 'portable-smoke.log'
          & node $harnesses[0].FullName 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'PORTABLE_DESKTOP_SMOKE_FAILED' }
          if (@(Select-String -LiteralPath $log -SimpleMatch 'BROWSER_SMOKE_IMAGE_COPY_STAGE_RESTORED').Count -ne 2) { throw 'PORTABLE_CLIPBOARD_SMOKE_MISSING' }
          $installed = Join-Path $candidate 'mipo-installed'
          $setup = Start-Process -FilePath (Join-Path $candidate $env:INSTALLER_ASSET) -ArgumentList "/S /D=$installed" -PassThru
          try {
            if (-not $setup.WaitForExit(120000)) { throw 'DESKTOP_INSTALL_TIMEOUT' }
            if ($setup.ExitCode -ne 0) { throw 'DESKTOP_INSTALL_FAILED' }
          } finally {
            if (-not $setup.HasExited) { Stop-Process -Id $setup.Id -Force }
          }
          # Every portable payload file must survive the actual NSIS install.
          foreach ($file in Get-ChildItem -LiteralPath $portableRoot -Recurse -File) {
            $relative = [IO.Path]::GetRelativePath($portableRoot, $file.FullName)
            $target = Join-Path $installed $relative
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "INSTALLED_FILE_MISSING $relative" }
            if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash) { throw "INSTALLED_FILE_MISMATCH $relative" }
          }
          $env:MIPO_SMOKE_EXECUTABLE = Join-Path $installed 'mipo.exe'
          Assert-X64Executable $env:MIPO_SMOKE_EXECUTABLE
          Assert-X64Executable (Join-Path $installed 'resources/mipo-core.exe')
          $log = Join-Path $candidate 'installed-smoke.log'
          & node $harnesses[0].FullName 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'INSTALLED_DESKTOP_SMOKE_FAILED' }
          if (@(Select-String -LiteralPath $log -SimpleMatch 'BROWSER_SMOKE_IMAGE_COPY_STAGE_RESTORED').Count -ne 2) { throw 'INSTALLED_CLIPBOARD_SMOKE_MISSING' }
          Write-Output ('MIPO_WINDOWS_PACKAGED_SMOKE_PASSED ' + $env:EXPECTED_SHA256 + ' ' + $env:INSTALLER_SHA256 + ' ' + $env:HARNESS_SHA256)
      - name: Verify native visited-link pixels
        if: inputs.release_tag != '' && inputs.kind == 'native'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          HARNESS_ASSET: ${{ inputs.harness_asset }}
          HARNESS_SHA256: ${{ inputs.harness_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^[A-Za-z0-9._-]+$') { throw 'INVALID_RELEASE_TAG' }
          if ($env:ASSET_NAME -notmatch '^MIPO-Native-[A-Za-z0-9._-]+-windows-x64.zip$') { throw 'INVALID_ASSET_NAME' }
          if ($env:HARNESS_ASSET -notmatch '^MIPO-Native-Smoke-[a-f0-9]{12}.zip$') { throw 'INVALID_HARNESS_NAME' }
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-f]{64}$' -or $env:HARNESS_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'INVALID_CHECKSUM' }
          $candidate = Join-Path $env:RUNNER_TEMP 'mipo-native'
          New-Item -ItemType Directory -Path $candidate | Out-Null
          foreach ($entry in @(@{name=$env:ASSET_NAME;hash=$env:EXPECTED_SHA256},@{name=$env:HARNESS_ASSET;hash=$env:HARNESS_SHA256})) {
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $entry.name --dir $candidate
            if ($LASTEXITCODE -ne 0) { throw 'CANDIDATE_DOWNLOAD_FAILED' }
            $archive = Join-Path $candidate $entry.name
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $entry.hash) { throw 'CANDIDATE_CHECKSUM_MISMATCH' }
            Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $candidate 'runtime')
          }
          $env:GH_TOKEN = $null
          $env:GITHUB_TOKEN = $null
          $executables = @(Get-ChildItem -LiteralPath (Join-Path $candidate 'runtime') -Recurse -Filter 'electron.exe')
          $harnesses = @(Get-ChildItem -LiteralPath (Join-Path $candidate 'runtime') -Recurse -Filter 'visited-link-runtime-probe.mjs')
          if ($executables.Count -ne 1 -or $harnesses.Count -ne 1) { throw 'RUNTIME_ENTRY_COUNT' }
          $receipt = Get-Content -LiteralPath (Join-Path $harnesses[0].Directory.Parent.FullName 'receipt.json') -Raw | ConvertFrom-Json
          if ($receipt.sourceSha256 -notmatch '^[0-9a-f]{64}$') { throw 'INVALID_PROBE_RECEIPT' }
          $env:MIPO_VISITED_PROBE_EXECUTABLE = $executables[0].FullName
          $env:MIPO_VISITED_PROBE_ARCH = 'x64'
          & node $harnesses[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_VISITED_LINK_PROBE_FAILED' }
          Write-Output ('MIPO_NATIVE_VISITED_PROBE_PASSED ' + $env:EXPECTED_SHA256 + ' ' + $receipt.sourceSha256)
